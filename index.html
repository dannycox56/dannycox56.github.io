        ${field('Expected payment date (optional)', 'exp', c.expected || '', 'date')}</div>
      <div data-for="submitted approved">${field('Amount', 'amt', c.amount || R.allowance, 'money')}</div>
      ${check('No claim this month (skip it)', 'skip', c.status === 'skip')}
      <p class="hint">"Paid" is filled in automatically when the payout shows up in an import. Mark it by hand if you haven't imported yet.</p>
      <div class="btnrow"><button class="btn" data-sheet="save">Save</button></div>`;
    const sync = ov => ov.querySelectorAll('[data-for]').forEach(d => d.style.display = d.dataset.for.split(' ').includes(st) ? '' : 'none');
    openSheet(body, {
      mounted: ov => { sync(ov); ov.querySelectorAll('#rseg button').forEach(b => b.onclick = () => { st = b.dataset.v; ov.querySelectorAll('#rseg button').forEach(x => x.classList.toggle('on', x === b)); sync(ov); }); },
      save: () => {
        if (val('skip')) R.claims[ym] = { status: 'skip' };
        else if (st === 'none') delete R.claims[ym];
        else R.claims[ym] = { status: st, submitted: val('sub') || undefined, approved: st !== 'submitted' ? (val('app') || undefined) : undefined, expected: st === 'approved' ? (val('exp') || undefined) : undefined, amount: Core.r2(Core.num(val('amt'))) || R.allowance };
        save(); render(); reimbSheet(year);
      }
    });
  }

  function reimbSettings() {
    const R = state.reimb;
    const body = `<h3>Reimbursement settings</h3>
      ${check('Track a health reimbursement', 'en', R.enabled)}
      ${field('Monthly allowance', 'allow', R.allowance || '', 'money')}
      ${field('Premium charge contains (comma-separated)', 'pm', R.premiumMatch || '', 'text', 'placeholder="e.g. ANTHEM"')}
      <p class="hint">Payouts are the transactions in the "Health reimbursement" category. Use an auto-sort rule to put your payout there.</p>
      ${field('Days from approval to payment', 'days', R.expectDays || 3, 'number', 'inputmode="numeric"')}
      <div class="btnrow"><button class="btn" data-sheet="save">Save</button></div>`;
    openSheet(body, {
      save: () => {
        R.enabled = val('en'); R.allowance = Core.r2(Core.num(val('allow'))); R.premiumMatch = val('pm').trim(); R.expectDays = +val('days') || 3;
        delete R.needsConfirm; if (!R.enabled) R.dismissedSetup = true;
        save(); render(); if (R.enabled && R.allowance) reimbSheet(); else closeSheet();
      }
    });
  }

  // ---------- PHASE 2: set-asides ----------
  function fundsCard() {
    const funds = state.funds || [];
    if (!funds.length) return `<h2>Set-asides</h2><button class="card" style="width:100%;text-align:left;border:0" data-act="funds"><b>Save ahead for lumpy bills</b><div class="sub small">Propane, septic, truck repairs: put a little aside each month so they aren't a surprise. Tap to set up.</div></button>`;
    const st = funds.map(f => Core.fundStatus(state, f));
    const held = st.reduce((s, x) => s + Math.max(0, x.balance), 0);
    return `<h2>Set-asides</h2><button class="card" style="width:100%;text-align:left;border:0" data-act="funds">
      ${st.map(x => `<div class="kv"><span>${esc(x.name)}</span><span class="num ${x.balance < 0 ? '' : ''}" style="${x.balance < 0 ? 'color:var(--red)' : ''}">${x.balance < 0 ? 'short ' + money(-x.balance) : money(x.balance)}</span></div>`).join('')}
      <div class="sub small" style="margin-top:6px">${money(held)} held back in checking. It's left out of Safe to spend and your emergency fund.</div></button>`;
  }

  function fundsSheet() {
    const funds = state.funds || [];
    const st = funds.map(f => Core.fundStatus(state, f));
    const missing = suggestedFunds().filter(s => !funds.some(f => f.name.toLowerCase() === s.name.toLowerCase()));
    const body = `<h3>Set-asides</h3><p class="sub" style="margin-top:-8px">Money held in checking for bills that don't come every month. Each month adds its amount; matching bills come out of it.</p>
      <div class="list">${st.map(x => `<button class="item" data-sheet="edit" data-id="${x.id}"><div class="main"><div class="title">${esc(x.name)}</div><div class="meta">${money(x.monthly)}/month since ${nice(x.start)} ${x.start.slice(0, 4)} · ${x.payments.length} payment${x.payments.length === 1 ? '' : 's'}</div></div>
        <div class="right num" style="${x.balance < 0 ? 'color:var(--red)' : ''}">${x.balance < 0 ? 'short ' + money(-x.balance) : money(x.balance)}</div></button>`).join('') || '<div class="empty">No set-asides yet.</div>'}</div>
      ${missing.length ? `<button class="btn block" data-sheet="suggest">Add ${missing.map(m => m.name.toLowerCase()).join(', ')}</button>` : ''}
      <button class="btn secondary block" style="margin-top:8px" data-sheet="add">+ Add a set-aside</button>
      <p class="hint" style="margin-top:12px">Total held: ${money(st.reduce((s, x) => s + Math.max(0, x.balance), 0))}. A set-aside that's "short" means a bill cost more than had built up.</p>`;
    openSheet(body, { edit: el => fundSheet(el.dataset.id), add: () => fundSheet(null), suggest: () => addSuggestedFunds(missing) });
  }

  function suggestedFunds() {
    return [
      { name: 'Propane', monthly: 120, match: 'propane, SHELBY COUNTY CO', cats: [] },
      { name: 'Septic', monthly: 6.67, match: 'septic', cats: [] },
      { name: 'Truck repairs', monthly: 100, match: '', cats: ['truck'] }
    ];
  }
  function addSuggestedFunds(list) {
    const start = Core.monthOf(Core.today()) + '-01';
    for (const s of list) state.funds.push({ id: Core.uid(), start, startBalance: 0, cap: 0, ...s });
    const reserve = state.recurring.find(i => i.reserve && i.sched && i.sched.kind === 'weekly');
    let msg = 'Set-asides added.';
    if (list.some(s => s.cats.includes('truck')) && reserve && reserve.amount >= 100) {
      const cut = Core.r2(100 * 12 / 52);
      if (confirm(`Truck repairs now have their own set-aside ($100/month).\n\nLower "${reserve.name}" from ${money(reserve.amount)} to ${money(reserve.amount - cut)} a week so the $100 isn't counted twice?`)) {
        reserve.amount = Math.round(reserve.amount - cut); msg = `Set-asides added. Planned spending is now ${money(reserve.amount)} a week.`;
      }
    }
    save(); render(); fundsSheet(); toast(msg);
  }

  function fundSheet(id) {
    const isNew = !id;
    const f = isNew ? { id: Core.uid(), name: '', monthly: '', match: '', cats: [], start: Core.monthOf(Core.today()) + '-01', startBalance: 0, cap: 0 } : state.funds.find(x => x.id === id);
    const stt = isNew ? null : Core.fundStatus(state, f);
    const body = `<h3>${isNew ? 'Add a set-aside' : esc(f.name)}</h3>
      ${stt ? `<div class="card"><div class="kv"><span>Built up</span><span class="num">${money(stt.accrued)}</span></div><div class="kv"><span>Paid out</span><span class="num">−${money(stt.spent)}</span></div><div class="kv"><span>Balance</span><b class="num">${money(stt.balance)}</b></div></div>
        ${stt.payments.length ? `<div class="list">${stt.payments.slice(0, 8).map(t => `<div class="item"><div class="main"><div class="title">${esc(t.note || t.desc)}</div><div class="meta">${nice(t.date)}</div></div><div class="right num">${money(-t.amount)}</div></div>`).join('')}</div>` : ''}` : ''}
      ${field('Name', 'name', f.name)}${field('Put aside each month', 'monthly', f.monthly, 'money')}
      <p class="hint">Tip: for a bill every few years, divide the cost by the months between bills. Septic every 5 years at $400 is about $6.67 a month.</p>
      ${field('Bills that come out of it: description or note contains (comma-separated)', 'match', f.match)}
      <span class="sub small" style="margin:0 4px">…or any charge in these categories:</span>
      <div class="card" style="margin-top:6px">${catOptions(['spend']).map(([v, l]) => check(esc(l), 'fc_' + v, (f.cats || []).includes(v))).join('')}</div>
      ${field('Start counting from', 'start', f.start, 'date')}
      ${field('Starting balance (money already set aside)', 'sb', f.startBalance || 0, 'money')}
      ${field('Stop adding once it reaches (optional)', 'cap', f.cap || '', 'money')}
      <p class="hint">You can also tap any transaction and choose "Paid from set-aside".</p>
      <div class="btnrow"><button class="btn" data-sheet="save">Save</button>${isNew ? '' : '<button class="btn danger" data-sheet="del">Delete</button>'}</div>`;
    openSheet(body, {
      save: () => {
        f.name = val('name').trim() || 'Set-aside'; f.monthly = Core.r2(Math.abs(Core.num(val('monthly')))); f.match = val('match').trim();
        f.cats = catOptions(['spend']).map(([v]) => v).filter(v => val('fc_' + v));
        f.start = val('start') || f.start; f.startBalance = Core.r2(Core.num(val('sb'))); f.cap = Core.r2(Core.num(val('cap')));
        if (isNew) state.funds.push(f); save(); render(); fundsSheet();
      },
      del: () => { if (confirm(`Delete the "${f.name}" set-aside? The money stays in checking.`)) { state.funds = state.funds.filter(x => x !== f); state.transactions.forEach(t => { if (t.fund === f.id) delete t.fund; }); save(); render(); fundsSheet(); } }
    });
  }

  // ---------- PHASE 2: watch list ----------
  const WTYPE = { duplicate: ['Possible double charge', 'red'], new: ['New', 'yellow'], price: ['Price change', 'yellow'], renewal: ['Coming up', ''], stopped: ['Stopped', ''] };
  function watchSheet(showSubs) {
    const w = Core.watchList(state);
    const body = `<h3>Watch list</h3>
      <div class="seg"><button class="${showSubs ? '' : 'on'}" data-sheet="tab" data-s="0">To look at (${w.items.length})</button><button class="${showSubs ? 'on' : ''}" data-sheet="tab" data-s="1">Regular charges</button></div>
      ${showSubs ? `<p class="sub" style="margin-top:0">Charges that repeat on a schedule: about <b>${money(w.subsMonthly)}</b> a month in total.</p>
        <div class="list">${w.subs.map(s => `<div class="item"><div class="main"><div class="title">${esc(s.label)}</div><div class="meta">${s.period} · last ${nice(s.last)} ${s.last.slice(0, 4)} · ${s.n} charges</div></div><div class="right"><div class="num">${money(s.amount)}</div><div class="meta num">${money(s.monthly)}/mo</div></div></div>`).join('') || '<div class="empty">None found yet. Import a few months of history.</div>'}</div>`
      : `<div class="list">${w.items.map(i => `<div class="item"><div class="main"><div class="title"><span class="pill ${WTYPE[i.type][1]}">${WTYPE[i.type][0]}</span> ${esc(i.title)}</div><div class="meta" style="white-space:normal">${esc(i.detail)}</div></div>
          <div class="right"><button class="btn secondary sm" data-sheet="dismiss" data-id="${esc(i.id)}">OK</button></div></div>`).join('') || '<div class="empty">Nothing new to look at.</div>'}</div>
        ${w.dismissedCount ? `<button class="link" data-sheet="restore">Show ${w.dismissedCount} I've already looked at</button>` : ''}
        <p class="hint">Tap OK once you've checked something and it won't come back.</p>`}`;
    openSheet(body, {
      tab: el => watchSheet(el.dataset.s === '1'),
      dismiss: el => { state.watchDismissed = [...new Set([...(state.watchDismissed || []), el.dataset.id])]; save(); render(); watchSheet(false); },
      restore: () => { state.watchDismissed = []; save(); render(); watchSheet(false); }
    });
  }

  // ---------- PHASE 2: what's new ----------
  function whatsNewSheet() {
    const funds = state.funds || [];
    const missing = suggestedFunds().filter(s => !funds.some(f => f.name.toLowerCase() === s.name.toLowerCase()));
    const body = `<h3>New in Pocket Budget</h3>
      <div class="card stack">
        <div><b>Health reimbursement tracker</b><div class="sub small">Shows each month's claim (submitted, approved, paid), reminds you after the premium posts, and warns before Dec 31. Approved claims count in the forecast.</div></div>
        <div><b>Set-asides</b><div class="sub small">Put a little aside each month for propane, septic and truck repairs. That money is held back from Safe to spend.</div></div>
        <div><b>Watch list</b><div class="sub small">Flags new subscriptions, price changes, double charges, and charges that stopped.</div></div>
      </div>
      ${missing.length ? `<button class="btn block" data-sheet="suggest">Add set-asides: ${missing.map(m => `${m.name} ${money0(m.monthly)}`).join(', ')}</button>` : ''}
      <button class="btn secondary block" style="margin-top:8px" data-sheet="ok">Got it</button>`;
    openSheet(body, {
      suggest: () => { state.seenVersion = 2; addSuggestedFunds(missing); },
      ok: () => { state.seenVersion = 2; done(); }
    });
  }

  // ---------- events ----------
  const pick = (id) => { const i = $(id); i.value = ''; i.click(); };
  document.addEventListener('click', e => {
    const sh = e.target.closest('[data-sheet]');
    if (sh && sheetHandlers[sh.dataset.sheet]) { e.preventDefault(); sheetHandlers[sh.dataset.sheet](sh); return; }
    const tabBtn = e.target.closest('nav.tabs button'); if (tabBtn) return go(tabBtn.dataset.tab);
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    const actions = {
      'pick-setup': () => pick('#jsonpick'), 'pick-restore': () => pick('#jsonpick'), 'pick-csv': () => pick('#csvpick'),
      'start-fresh': () => {
        state = Core.blankState();
        state.budgets = [{ id: 'b1', name: 'Groceries/household', cats: ['groceries'], cap: 500 }, { id: 'b2', name: 'Eating out', cats: ['eatout'], cap: 100 }];
        save(); go('settings'); balanceSheet();
      },
      'edit-balance': balanceSheet, 'event': () => eventSheet(a.dataset.key),
      'horizon': () => { state.settings.horizon = +a.dataset.days; save(); render(); },
      'add-one': () => {
        const o = { id: Core.uid(), name: '', amount: '', dir: 'out', date: Core.today(), account: state.settings.mainAccount, status: 'confirmed' };
        openSheet(`<h3>Add a one-time item</h3>${oneTimeForm(o)}<div class="btnrow"><button class="btn" data-sheet="save">Add</button></div>`, { save: () => { readOneTime(o); if (!o.amount) return toast('Add an amount.'); state.oneTimes.push(o); done(); } });
      },
      'month': () => { ui.month = shiftMonth(ui.month, +a.dataset.k); ui.filter = ui.filter.startsWith('cat:') ? ui.filter : ui.filter; render(); },
      'filter': () => { ui.filter = a.dataset.f; ui.search = ''; render(); const l = $('#txlist'); if (l) l.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
      'show-review': () => { ui.filter = 'review'; ui.search = ''; go('spending'); setTimeout(() => { const l = $('#txlist'); if (l) l.scrollIntoView({ block: 'start' }); }, 50); },
      'tx': () => txSheet(a.dataset.id), 'add-manual': manualSheet,
      'unstage': () => { ui.staged.splice(+a.dataset.i, 1); render(); },
      'map': () => mapSheet(+a.dataset.i), 'do-import': doImport,
      'list-recurring': listRecurring, 'list-budgets': listBudgets, 'edit-ef': efSheet,
      'list-accounts': listAccounts, 'edit-account': () => accountSheet(a.dataset.id), 'list-categories': listCategories, 'list-rules': listRules,
      'backup': backup, 'summary': summarySheet,
      'reimb': () => reimbSheet(), 'funds': fundsSheet, 'watch': () => watchSheet(false),
      'reset': () => { if (confirm('Erase all data on this phone? Make a backup first if you might want it back.') && confirm('Are you sure? This cannot be undone.')) { state = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); } }
    };
    if (actions[act]) actions[act]();
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'csvpick' && el.files.length) { stageFiles([...el.files]); go('import'); }
    if (el.id === 'jsonpick' && el.files.length) restoreFrom(el.files[0]);
    if (el.dataset.actChange === 'stage-acct') {
      const f = ui.staged[+el.dataset.i]; f.account = el.value;
      const a = acct(el.value);
      if (f.format === 'custom' && !a.customMap) f.format = null; else if (f.format) reparse(f);
      render();
    }
  });
  let searchTimer;
  document.addEventListener('input', e => {
    if (e.target.dataset.input === 'search') {
      ui.search = e.target.value; clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const s = $('[data-input=search]'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }, 250);
    }
  });

  // ---------- start ----------
  load(); render();
  if (state && (state.seenVersion || 1) < 2) setTimeout(whatsNewSheet, 300);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.PocketBudget = { get state() { return state; }, render };
})();
</script>
</body>
</html>
